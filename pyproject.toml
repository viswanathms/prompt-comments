[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-comments"
version = "0.1.0"
description = "Write comments in your AI prompts, strip them before they reach the model."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "viswanathms" },
]
keywords = ["prompt", "prompt-engineering", "llm", "ai", "comments", "jinja", "template", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/viswanathms/prompt-comments"
Repository = "https://github.com/viswanathms/prompt-comments"
Issues = "https://github.com/viswanathms/prompt-comments/issues"

[project.scripts]
prompt-comments = "prompt_comments.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_comments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
